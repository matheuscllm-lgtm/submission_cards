[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "submission-cards"
version = "0.1.0"
description = "Decision support for RAW, COMC, PSA and CGC card routing"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
submission-cards = "submission_cards.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
