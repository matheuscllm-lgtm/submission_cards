name: Synthetic tests
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Run synthetic tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Check CLI
        env:
          PYTHONPATH: src
        run: python -m submission_cards.cli --help
